<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>📚 Biblioteca Escolar</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
        select, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; }
        button { background: #007bff; color: white; border: none; font-size: 16px; font-weight: bold; }
        #reader { width: 100%; height: 250px; background: #333; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>📚 Biblioteca Escolar</h2>
    
    <select id="turmaSelect"><option>A carregar turmas...</option></select>
    
    <div id="botoes-acao">
        <button id="btnEmprestimo">Empréstimo</button>
        <button id="btnDevolucao">Devolução</button>
    </div>
    
    <button onclick="iniciarLeitor()">📸 Abrir Câmera Traseira</button>
    <div id="reader"></div>
</div>

<script>
    // CREDENCIAIS ORIGINAIS
    const SUPABASE_URL = "https://hltatpgnhnhqvstosmqw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PKYGh7OuSkfobn6c_dKb2w_9I3G9re8";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // FUNÇÃO QUE CARREGA TURMAS (A que você tinha originalmente)
    async function carregarDados() {
        try {
            const { data, error } = await supabase.from('turmas').select('nome');
            if (error) throw error;
            const select = document.getElementById('turmaSelect');
            select.innerHTML = '<option value="">Selecione a turma...</option>';
            data.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t.nome; opt.textContent = t.nome;
                select.appendChild(opt);
            });
        } catch (e) {
            console.error("Erro ao carregar turmas:", e);
        }
    }

    // FUNÇÃO DE CÂMERA COM TRAVA TRASEIRA
    function iniciarLeitor() {
        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: { exact: "environment" } }, 
            { fps: 10, qrbox: 250 },
            (decodedText) => {
                alert("Livro lido: " + decodedText);
                html5QrCode.stop();
            },
            (error) => {}
        ).catch(err => {
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: 250 },
                (dt) => { alert("Livro: " + dt); html5QrCode.stop(); },
                (err) => { alert("Erro na câmara traseira: " + err); }
            );
        });
    }

    // Inicialização
    carregarDados();
</script>
</body>
</html>
